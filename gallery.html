const nEl=document.getElementById('n');
function nSel(){return [...document.querySelectorAll('figure.del')].map(f=>f.dataset.id);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';
 setTimeout(()=>t.style.display='none',1400);}
document.getElementById('g').addEventListener('click',e=>{
 const f=e.target.closest('figure'); if(!f)return;
 f.classList.toggle('del'); nEl.textContent=nSel().length;});
document.getElementById('cl').onclick=()=>{
 document.querySelectorAll('figure.del').forEach(f=>f.classList.remove('del'));
 nEl.textContent=0;};
document.getElementById('cp').onclick=async()=>{
 const ids=nSel(); if(!ids.length){toast('还没选任何表情包');return;}
 const txt=ids.join('\n');
 try{await navigator.clipboard.writeText(txt); toast('已复制 '+ids.length+' 个编号，粘到 要删的表情包.txt 即可');}
 catch(err){prompt('复制下面这串编号：',txt);}
};
</script></body></html>
