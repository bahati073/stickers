<div id="bar"><span>已选 <b id="n">0</b> 张</span>
 <button id="cp">复制清单</button><button class="gray" id="cl">清空</button></div>
<div id="toast"></div>
<script>
const q=document.getElementById('q'), chips=document.getElementById('chips');
let cur='';
['全部',...["震惊", "日常", "钱", "干饭", "吃瓜", "难过", "摆烂", "喜欢", "夸奖", "求助", "开心", "生气", "嘲讽", "可爱", "撒娇", "尴尬", "害羞", "搞笑", "沙雕", "问候", "拒绝", "疑问", "自嘲", "加油", "威胁", "无语", "得意", "睡觉", "离开"]].forEach((e,i)=>{
 const b=document.createElement('span'); b.className='chip'+(i===0?' on':''); b.textContent=e;
 b.onclick=()=>{document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  b.classList.add('on'); cur=(e==='全部'?'':e); flt();}; chips.appendChild(b);});
function flt(){const s=q.value.toLowerCase();
 document.querySelectorAll('figure').forEach(f=>{
  const t=(f.dataset.e+' '+f.dataset.s+' '+f.textContent).toLowerCase();
  f.style.display=((!cur||f.dataset.e.includes(cur))&&(!s||t.includes(s)))?'':'none';});}
q.oninput=flt;

const nEl=document.getElementById('n');
function nSel(){return [...document.querySelectorAll('figure.del')].map(f=>f.dataset.id);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';
 setTimeout(()=>t.style.display='none',1400);}
document.getElementById('g').addEventListener('click',e=>{
 const f=e.target.closest('figure'); if(!f)return;
 f.classList.toggle('del'); nEl.textContent=nSel().length;});
document.getElementById('cl').onclick=()=>{
 document.querySelectorAll('figure.del').forEach(f=>f.classList.remove('del'));
 nEl.textContent=0;};
document.getElementById('cp').onclick=async()=>{
 const ids=nSel(); if(!ids.length){toast('还没选任何表情包');return;}
 const txt=ids.join('\n');
 try{await navigator.clipboard.writeText(txt); toast('已复制 '+ids.length+' 个编号，粘到 要删的表情包.txt 即可');}
 catch(err){prompt('复制下面这串编号：',txt);}
};
</script></body></html>
